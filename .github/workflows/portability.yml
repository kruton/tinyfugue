---
name: Portability

on:
  schedule:
    - cron: '31 5 * * *'
  workflow_dispatch:

concurrency:
  group: portability-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: NetBSD
            action: netbsd
          - name: OpenBSD
            action: openbsd
          - name: Solaris
            action: solaris
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: NetBSD build
        if: matrix.action == 'netbsd'
        uses: vmactions/netbsd-vm@7f23a491dcc69c34195721ab67934917707f84c7 # v1.4.9
        with:
          usesh: true
          prepare: /usr/sbin/pkg_add -u cmake ninja-build pcre2 icu openssl ncurses
          run: |
            cmake -S . -B build -G Ninja -DBUILD_TESTING=ON
            cmake --build build
            ctest --test-dir build --output-on-failure
      - name: OpenBSD build
        if: matrix.action == 'openbsd'
        uses: vmactions/openbsd-vm@86cdc08415d9d0865267e686561e276c52d62530 # v1.4.7
        with:
          usesh: true
          prepare: |
            pkg_add -I -D installed cmake ninja pcre2 icu4c
            pkg_add -I -u cmake ninja pcre2 icu4c
          run: |
            cmake -S . -B build -G Ninja -DBUILD_TESTING=ON \
              -DTF_TLS=OFF
            cmake --build build
            ctest --test-dir build --output-on-failure
      - name: Solaris build
        if: matrix.action == 'solaris'
        uses: vmactions/solaris-vm@315163f088b66e55bbcc45928bd224d4973b2312 # v1.3.8
        with:
          release: 11.4-gcc
          usesh: true
          prepare: pkg install cmake ninja pcre2 developer/icu openssl ncurses
          run: |
            cmake -S . -B build -G Ninja -DBUILD_TESTING=ON
            cmake --build build
            ctest --test-dir build --output-on-failure
